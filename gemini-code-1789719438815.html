<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Eats Fish - Teachable Machine Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #2c3e50;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 24px;
    }
    #game-container {
      position: relative;
      width: 600px;
      height: 400px;
      background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
      border: 4px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    canvas {
      display: block;
    }
    #webcam-container {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 120px;
      height: 120px;
      border: 2px solid #fff;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    #webcam-container video, #webcam-container canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }
    #controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #27ae60;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #219150;
    }
    #status {
      font-size: 14px;
      color: #ecf0f1;
    }
    #predictions {
      margin-top: 15px;
      width: 600px;
      background: #34495e;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-around;
      font-weight: bold;
    }
    .label-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .prob-bar {
      width: 100px;
      height: 10px;
      background: #555;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 4px;
    }
    .prob-fill {
      height: 100%;
      width: 0%;
      background: #f1c40f;
      transition: width 0.1s;
    }
  </style>

  <!-- TensorFlow.js and Teachable Machine Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.3/dist/teachablemachine-pose.min.js"></script>
  <!-- Fallback Image classification library if pose model isn't used -->
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
</head>
<body>

  <h1>🐱 Cat Eats Fish (AI Controlled)</h1>

  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div id="webcam-container"></div>
  </div>

  <div id="controls">
    <button id="start-btn" onclick="init()">Start Camera & Game</button>
    <span id="status">Click start to enable webcam...</span>
  </div>

  <div id="predictions">
    <div class="label-box">
      <span>Happy (Left)</span>
      <div class="prob-bar"><div id="bar-happy" class="prob-fill"></div></div>
      <span id="val-happy">0%</span>
    </div>
    <div class="label-box">
      <span>Normal (Stop)</span>
      <div class="prob-bar"><div id="bar-normal" class="prob-fill"></div></div>
      <span id="val-normal">0%</span>
    </div>
    <div class="label-box">
      <span>Sad (Right)</span>
      <div class="prob-bar"><div id="bar-sad" class="prob-fill"></div></div>
      <span id="val-sad">0%</span>
    </div>
  </div>

  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/jzOGl-Ytg/";

    let model, webcam, maxPredictions;
    let isModelLoaded = false;

    // Game state
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let score = 0;
    let cat = {
      x: canvas.width / 2 - 25,
      y: canvas.height - 60,
      width: 50,
      height: 50,
      speed: 5,
      dx: 0
    };

    let fishes = [];
    let lastFishTime = 0;

    // Control Logic Threshold Check
    function updateCatMovement(prediction) {
      let happyProb = 0;
      let sadProb = 0;
      let normalProb = 0;

      for (let i = 0; i < prediction.length; i++) {
        const classLabel = prediction[i].className.toLowerCase().trim();
        const prob = prediction[i].probability;

        if (classLabel.includes("happy")) {
          happyProb = prob;
          updateBar("happy", prob);
        } else if (classLabel.includes("sad")) {
          sadProb = prob;
          updateBar("sad", prob);
        } else if (classLabel.includes("normal")) {
          normalProb = prob;
          updateBar("normal", prob);
        }
      }

      // Movement conditions requested:
      // happy > 0.80 -> move left
      // sad > 0.80 -> move right
      // normal > 0.80 -> stop
      if (happyProb > 0.80) {
        cat.dx = -cat.speed;
      } else if (sadProb > 0.80) {
        cat.dx = cat.speed;
      } else if (normalProb > 0.80) {
        cat.dx = 0;
      }
    }

    function updateBar(label, prob) {
      const percentage = Math.round(prob * 100);
      const bar = document.getElementById(`bar-${label}`);
      const val = document.getElementById(`val-${label}`);
      if (bar && val) {
        bar.style.width = percentage + "%";
        val.innerText = percentage + "%";
      }
    }

    // Initialize Teachable Machine Model & Webcam
    async function init() {
      document.getElementById("start-btn").disabled = true;
      document.getElementById("status").innerText = "Loading model...";

      const modelURL = MODEL_URL + "model.json";
      const metadataURL = MODEL_URL + "metadata.json";

      try {
        // Try loading as Image Classification model
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        webcam = new tmImage.Webcam(120, 120, true); // width, height, flip
        await webcam.setup();
        await webcam.play();
        window.requestAnimationFrame(webcamLoop);

        document.getElementById("webcam-container").appendChild(webcam.canvas);
        document.getElementById("status").innerText = "Model loaded! Play by changing expression.";
        isModelLoaded = true;
      } catch (e) {
        console.error("Image model load failed, attempting Pose model...", e);
        try {
          // Fallback to Pose model if the model was trained using Teachable Machine Pose
          model = await tmPose.load(modelURL, metadataURL);
          maxPredictions = model.getTotalClasses();

          webcam = new tmPose.Webcam(120, 120, true);
          await webcam.setup();
          await webcam.play();
          window.requestAnimationFrame(webcamLoopPose);

          document.getElementById("webcam-container").appendChild(webcam.canvas);
          document.getElementById("status").innerText = "Pose Model loaded! Play using poses.";
          isModelLoaded = true;
        } catch (err) {
          console.error(err);
          document.getElementById("status").innerText = "Error loading model. Check console.";
        }
      }
    }

    async function webcamLoop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(webcamLoop);
    }

    async function webcamLoopPose() {
      webcam.update();
      await predictPose();
      window.requestAnimationFrame(webcamLoopPose);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      updateCatMovement(prediction);
    }

    async function predictPose() {
      const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
      const prediction = await model.predict(posenetOutput);
      updateCatMovement(prediction);
    }

    // Spawn falling fish
    function spawnFish() {
      const now = Date.now();
      if (now - lastFishTime > 1200) { // Spawn every 1.2s
        fishes.push({
          x: Math.random() * (canvas.width - 30),
          y: -30,
          width: 30,
          height: 20,
          speed: 2 + Math.random() * 2
        });
        lastFishTime = now;
      }
    }

    // Main Game Loop
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Move Cat
      cat.x += cat.dx;
      // Keep cat inside canvas bounds
      if (cat.x < 0) cat.x = 0;
      if (cat.x + cat.width > canvas.width) cat.x = canvas.width - cat.width;

      // 2. Draw Cat
      ctx.font = "40px Arial";
      ctx.fillText("🐱", cat.x, cat.y + 40);

      // 3. Spawn & Move Fishes
      spawnFish();
      for (let i = fishes.length - 1; i >= 0; i--) {
        let f = fishes[i];
        f.y += f.speed;

        // Draw Fish
        ctx.font = "24px Arial";
        ctx.fillText("🐟", f.x, f.y + 20);

        // Check Collision with Cat
        if (
          f.x < cat.x + cat.width &&
          f.x + f.width > cat.x &&
          f.y < cat.y + cat.height &&
          f.y + f.height > cat.y
        ) {
          score += 10;
          fishes.splice(i, 1);
          continue;
        }

        // Remove off-screen fish
        if (f.y > canvas.height) {
          fishes.splice(i, 1);
        }
      }

      // 4. Draw Score
      ctx.fillStyle = "#2c3e50";
      ctx.font = "bold 20px Arial";
      ctx.fillText(`Score: ${score}`, 15, 30);

      requestAnimationFrame(gameLoop);
    }

    // Start rendering game
    gameLoop();
  </script>
</body>
</html>
